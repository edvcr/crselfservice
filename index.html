<div class="zone" id="zone"><div class="devwrap" id="wrap"><iframe id="stage" srcdoc="<!DOCTYPE html><html><head><meta charset=&quot;utf-8&quot;><meta name=&quot;viewport&quot; content=&quot;width=device-width,initial-scale=1&quot;><title>CoinsRaid Help Widget</title><link rel=&quot;preconnect&quot; href=&quot;https://fonts.gstatic.com&quot; crossorigin><link href=&quot;https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&amp;display=swap&quot; rel=&quot;stylesheet&quot;><style>html,body{height:100%;margin:0;background:#0e0620}</style></head><body><script>window.CRH_SNAPSHOT={&quot;generated&quot;:&quot;2026-08-17T08:53:59Z&quot;,&quot;sections&quot;:[{&quot;id&quot;:29389414007836,&quot;name&quot;:&quot;Getting Started&quot;,&quot;description&quot;:&quot;Learn what CoinsRaid is, how to join, and where you can play.&quot;,&quot;position&quot;:0},{&quot;id&quot;:29389820317468,&quot;name&quot;:&quot;Account and Rewards&quot;,&quot;description&quot;:&quot;Manage your account, complete verification, and stay in control of your gameplay.&quot;,&quot;position&quot;:1},{&quot;id&quot;:29389812953116,&quot;name&quot;:&quot;Coins, Entries and Prizes&quot;,&quot;description&quot;:&quot;Understand how Gold and Sweeps Coins work, how to earn, play, and redeem prizes.&quot;,&quot;position&quot;:2},{&quot;id&quot;:29641700671260,&quot;name&quot;:&quot;FAQ&quot;,&quot;description&quot;:&quot;Common questions answered&quot;,&quot;position&quot;:3}],&quot;articles&quot;:[{&quot;id&quot;:29414547667100,&quot;section_id&quot;:29389820317468,&quot;title&quot;:&quot;Why Can\u0027t I Register an Account?&quot;,&quot;body&quot;:&quot;\u003cp\u003eIf you cannot complete registration and you are blocked before entering your address or identity details, it means our security systems detected a risk signal connected to your device, network, or contact information. This is automatic and happens to protect players and prevent fraud.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eCommon reasons why registration is blocked:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\n\u003cstrong\u003eEmail or phone number has a risk history\u003c/strong\u003e\u003cbr\u003eIf the email or phone number you entered has been associated with suspicious behavior on other platforms or services, our external security tools may classify it as high risk. Even if the activity did not happen on CoinsRaid, these signals can block registration.\u003c/li\u003e\n\u003cli\u003e\n\u003cstrong\u003eYour device or network is flagged\u003c/strong\u003e\u003cbr\u003eIf the device, browser, or IP address you are using has been linked to unusual or high-risk activity in the past, the system may automatically stop new account creation. This can include multiple failed signups, shared devices, or previously flagged activity.\u003c/li\u003e\n\u003cli\u003e\n\u003cstrong\u003eThird-party fraud signals\u003c/strong\u003e\u003cbr\u003eWe use industry-standard fraud-prevention partners that compare patterns across many global services. If they detect that your contact details, device fingerprint, or behavior match known fraud or abuse patterns from outside CoinsRaid, the system will prevent registration.\u003c/li\u003e\n\u003cli\u003e\n\u003cstrong\u003eRegion or IP restrictions\u003c/strong\u003e\u003cbr\u003eIf your IP address indicates a restricted location, registration is automatically stopped. See \u003ca href=\&quot;https://coinsraidcom.zendesk.com/hc/en-us/articles/29413609958428-Can-I-play-CoinsRaid-in-my-state\&quot;\u003eCan I play CoinsRaid in my state?\u003c/a\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cstrong\u003eYou already have an account\u003c/strong\u003e\u003cbr\u003eEach player can only have \u003cstrong\u003eone\u003c/strong\u003e CoinsRaid account. Multiple accounts under the same person, household, or device are not allowed. See \u003ca href=\&quot;https://coinsraidcom.zendesk.com/hc/en-us/articles/29414500391452-Can-I-Have-More-Than-One-Account\&quot;\u003eCan I Have More Than One Account?\u003c/a\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003cdiv style=\&quot;background:#f5f5f5;border-left:4px solid #999;padding:12px 16px;margin:16px 0;border-radius:4px;\&quot;\u003e⚠️ Always use your own devices, disable VPNs, proxies or anonymizers. Use a trusted network (e.g., home Wi-Fi) and use only your personal email with no prior fraud history.\u003c/div\u003e\n&quot;,&quot;position&quot;:0},{&quot;id&quot;:29414547578524,&quot;section_id&quot;:29389812953116,&quot;title&quot;:&quot;What Are Bonus Coins and How Do They Work?&quot;,&quot;body&quot;:&quot;\u003cp\u003eBonus Coins are extra Gold Coins (GC) or Sweeps Coins (SC) that you can earn through promotions, missions, and special events. They’re designed to make your CoinsRaid experience more rewarding and fun while you explore new games and levels.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eBonus Gold Coins (GC):\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eUsed for entertainment play only.\u003c/li\u003e\n\u003cli\u003eGC have \u003cstrong\u003eno cash or monetary value\u003c/strong\u003e, are \u003cstrong\u003enot redeemable for cash or prizes\u003c/strong\u003e, and may not be exchanged, transferred, assigned, or sold.\u003c/li\u003e\n\u003cli\u003eOften given as part of welcome offers, the Daily Lootbox, or promotional events.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eBonus Sweeps Coins (SC):\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eAwarded freely through promotions, missions, or Alternate Method of Entry (AMOE).\u003c/li\u003e\n\u003cli\u003eMust be played at least \u003cstrong\u003eonce (1×)\u003c/strong\u003e on eligible slot games before becoming \u003cstrong\u003eRedeemable SC\u003c/strong\u003e.\u003c/li\u003e\n\u003cli\u003eCan’t be used on table games, live dealer, video poker, or specialty games until converted.\u003c/li\u003e\n\u003cli\u003eOnce converted, Redeemable SC can be used in any eligible sweepstakes game or redeemed for prizes after verification.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eXP (Experience Points):\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eXP measures your activity and progress across CoinsRaid.\u003c/li\u003e\n\u003cli\u003eYou earn XP by playing games, completing missions, and participating in events.\u003c/li\u003e\n\u003cli\u003eAs your XP increases, you advance through levels in the \u003cstrong\u003eRaider’s Guild\u003c/strong\u003e, unlocking new rewards, bonuses, and collectibles.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eCan I send my coins to a friend?\u003c/strong\u003e\u003c/p\u003e\n\u003cdiv style=\&quot;background:#f5f5f5;border-left:4px solid #999;padding:12px 16px;margin:16px 0;border-radius:4px;\&quot;\u003e❗ Bonus Coins and XP are personal and \u003cstrong\u003enon-transferable\u003c/strong\u003e. They can’t be traded, sold, or shared between accounts.\u003c/div\u003e\n&quot;,&quot;position&quot;:0},{&quot;id&quot;:29414532370460,&quot;section_id&quot;:29641700671260,&quot;title&quot;:&quot;Frequently Asked Questions&quot;,&quot;body&quot;:&quot;\u003ch3\u003eHow do I create a CoinsRaid account?\u003c/h3\u003e\n\u003cp\u003eGo to \u003ca href=\&quot;https://coinsraid.com/\&quot;\u003e\u003cstrong\u003ehttps://coinsraid.com/\u003c/strong\u003e\u003c/a\u003e and click the \u003cstrong\u003eRegister\u003c/strong\u003e button. For details see \u003ca href=\&quot;https://coinsraidcom.zendesk.com/hc/en-us/articles/29414532276252-How-to-Create-Your-CoinsRaid-Account\&quot;\u003eHow to Create Your CoinsRaid Account\u003c/a\u003e.\u003c/p\u003e\n\u003ch3\u003eHow old do you have to be to play at CoinsRaid?\u003c/h3\u003e\n\u003cp\u003eYou must be at least \u003cstrong\u003e18\u003c/strong\u003e years old to play CoinsRaid. In some states, the minimum age is higher. For details, see \u003ca href=\&quot;https://coinsraidcom.zendesk.com/hc/en-us/articles/29414532276252-How-to-Create-Your-CoinsRaid-Account\&quot;\u003eHow to Create Your CoinsRaid Account\u003c/a\u003e. \u003ca href=\&quot;https://coinsraid.com/general-terms\&quot;\u003e\u003cstrong\u003eGeneral Terms \u0026amp; Conditions\u003c/strong\u003e\u003c/a\u003e also may apply.\u003c/p\u003e\n\u003ch3\u003eCan I have more than one account?\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003eNo.\u003c/strong\u003e Each player may only create and maintain \u003cstrong\u003eone\u003c/strong\u003e CoinsRaid account. For details, see \u003ca href=\&quot;https://coinsraidcom.zendesk.com/hc/en-us/articles/29414500391452-Can-I-Have-More-Than-One-Account\&quot;\u003eCan I Have More Than One Account?\u003c/a\u003e\u003c/p\u003e\n\u003ch3\u003eCan I play for free without buying anything?\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003eYes\u003c/strong\u003e — use the \u003ca href=\&quot;https://coinsraidcom.zendesk.com/hc/en-us/articles/29414547615388-Alternate-Method-of-Entry-AMOE-Play-for-Free\&quot;\u003eAlternate Method of Entry (AMOE)\u003c/a\u003e to receive free Sweeps Coins with the same odds as any other SC.\u003c/p\u003e\n\u003ch3\u003eHow do I take a break or self-exclude?\u003c/h3\u003e\n\u003cp\u003eUse the self-exclusion feature in your account’s \u003ca href=\&quot;https://coinsraid.com/self-exclusion\&quot;\u003e\u003cstrong\u003eResponsible Gaming\u003c/strong\u003e\u003c/a\u003e section. For more details check \u003ca href=\&quot;https://coinsraidcom.zendesk.com/hc/en-us/articles/29414532635676-Responsible-Gaming-How-It-Works\&quot;\u003eResponsible Gaming: How It Works\u003c/a\u003e.\u003c/p\u003e\n\u003ch3\u003eCan I play while traveling or using a VPN?\u003c/h3\u003e\n\u003cp\u003eAccess depends on your verified location; VPNs, proxies or blocked states can limit play and redemption.\u003c/p\u003e\n\u003ch3\u003eWhy is my account suspended?\u003c/h3\u003e\n\u003cp\u003eYour account may be temporarily restricted due to verification, location checks, or compliance reviews. For details, see \u003ca href=\&quot;https://coinsraidcom.zendesk.com/hc/en-us/articles/29414547700892-Why-Is-My-Account-Restricted-or-Suspended\&quot;\u003eWhy Is My Account Restricted or Suspended?\u003c/a\u003e\u003c/p\u003e\n\u003ch3\u003eCan I send my coins to a friend?\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003eNo.\u003c/strong\u003e Coins can’t be transferred, gifted, or shared between accounts. Each CoinsRaid account is personal, and all Gold and Sweeps Coins must be used only by the registered player. For details, see \u003ca href=\&quot;https://coinsraidcom.zendesk.com/hc/en-us/articles/29414547578524-What-Are-Bonus-Coins-and-How-Do-They-Work\&quot;\u003eWhat Are Bonus Coins and How Do They Work?\u003c/a\u003e\u003c/p\u003e\n\u003ch3\u003eWhy am I unable to redeem my prize?\u003c/h3\u003e\n\u003cp\u003eYou can’t redeem a prize if your account isn’t fully verified, you’re in a restricted state, or your Sweeps Coins haven’t met the 1× playthrough requirement. Make sure your verification is complete and you’re using Redeemable SC from an eligible location. For details, see \u003ca href=\&quot;https://coinsraidcom.zendesk.com/hc/en-us/articles/29414532464028-How-to-Redeem-Prizes\&quot;\u003eHow to Redeem Prizes\u003c/a\u003e and \u003ca href=\&quot;https://coinsraidcom.zendesk.com/hc/en-us/articles/29414547757724-How-to-Verify-Your-Account\&quot;\u003eHow to Verify Your Account\u003c/a\u003e.\u003c/p\u003e\n\u003ch3\u003eHow do I purchase Gold Coins?\u003c/h3\u003e\n\u003cp\u003eYou can purchase Gold Coins directly from your account dashboard using credit/debit cards, e-wallets, or other accepted payment methods. Each Gold Coin package also includes bonus Sweeps Coins.\u003c/p\u003e\n\u003ch3\u003eWhat\u0027s the difference between Gold Coins and Sweeps Coins?\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003eGold Coins (GC)\u003c/strong\u003e are for entertainment play only and cannot be redeemed for prizes. \u003cstrong\u003eSweeps Coins (SC)\u003c/strong\u003e can be redeemed for cash prizes after meeting playthrough requirements. Both types let you play the same games.\u003c/p\u003e\n\u003ch3\u003eHow long does account verification take?\u003c/h3\u003e\n\u003cp\u003eMost verifications are completed within \u003cstrong\u003e24-48 hours\u003c/strong\u003e. You may be asked to provide a government-issued ID, proof of address, or other documents. Check your email and account notifications for updates.\u003c/p\u003e\n\u003ch3\u003eHow do I contact customer support?\u003c/h3\u003e\n\u003cp\u003eYou can reach our support team via live chat on the website, email, or through your account dashboard. Support is available 24/7 to assist with account questions, technical issues, and redemption inquiries. See \u003ca href=\&quot;https://coinsraidcom.zendesk.com/hc/en-us/articles/29414547537436-How-to-get-Support\&quot;\u003eHow to get Support\u003c/a\u003e.\u003c/p\u003e\n\u003ch3\u003eWhat happens to my coins if I self-exclude?\u003c/h3\u003e\n\u003cp\u003eDuring self-exclusion, your account is locked and you cannot access your coins or play games. After the exclusion period ends, your coin balance will be restored and available for use.\u003c/p\u003e\n\u003ch3\u003eCan I reset my password if I forgot it?\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003eYes.\u003c/strong\u003e Click the \u003cstrong\u003eForgot Password\u003c/strong\u003e link on the login page and follow the instructions sent to your registered email address to reset your password securely.\u003c/p\u003e\n\u003ch3\u003eAre my winnings taxable?\u003c/h3\u003e\n\u003cp\u003ePrizes may be subject to federal and state taxes depending on the amount and your location. CoinsRaid will provide necessary tax documentation (such as Form 1099) for qualifying redemptions. Consult a tax professional for specific guidance.\u003c/p\u003e\n\u003ch3\u003eHow long does it take to process a redemption?\u003c/h3\u003e\n\u003cp\u003eRedemption processing typically takes \u003cstrong\u003e3-7 business days\u003c/strong\u003e after your request is approved. The exact time depends on your chosen payment method and any additional verification requirements.\u003c/p\u003e\n\u003ch3\u003eWhat is the minimum redemption amount?\u003c/h3\u003e\n\u003cp\u003eThe minimum redemption is typically \u003cstrong\u003e100 SC\u003c/strong\u003e (Sweeps Coins). Check your account dashboard for current redemption thresholds and available redemption options.\u003c/p\u003e\n\u003ch3\u003eDo my Gold Coins or Sweeps Coins expire?\u003c/h3\u003e\n\u003cp\u003eGold Coins and purchased Sweeps Coins generally do not expire. However, bonus coins received through promotions may have expiration dates. Check the specific terms for each promotion.\u003c/p\u003e\n\u003ch3\u003eCan I play on my mobile device?\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003eYes.\u003c/strong\u003e CoinsRaid is fully optimized for mobile browsers on iOS and Android devices. Simply visit the website from your mobile browser to play — no app download required.\u003c/p\u003e\n\u003ch3\u003eWhat payment methods do you accept?\u003c/h3\u003e\n\u003cp\u003eWe accept major credit and debit cards (Visa, Mastercard, American Express), e-wallets, and other secure payment methods. Available options may vary based on your location.\u003c/p\u003e\n\u003ch3\u003eWhat does the 1× playthrough requirement mean?\u003c/h3\u003e\n\u003cp\u003eYou must wager your Sweeps Coins at least once before they become redeemable. For example, if you have 100 SC, you need to place bets totaling 100 SC before you can redeem those coins for prizes.\u003c/p\u003e\n\u003ch3\u003eCan I change my email address or personal information?\u003c/h3\u003e\n\u003cp\u003eTo change your email or other personal details, contact customer support. Some changes may require additional verification to ensure account security.\u003c/p\u003e\n\u003ch3\u003eWhich states is CoinsRaid available in?\u003c/h3\u003e\n\u003cp\u003eCoinsRaid is available in most US states. However, certain states have restrictions on sweepstakes gaming. Your location is verified when you log in, and access is automatically determined based on your verified location.\u003c/p\u003e\n\u003ch3\u003eAre there Daily Lootbox rewards or promotions?\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003eYes.\u003c/strong\u003e CoinsRaid regularly offers Daily Lootbox rewards, special promotions, and seasonal events. Check your CoinsRaid Hub to see current offers.\u003c/p\u003e\n\u003ch3\u003eWhat happens if I have a technical issue during gameplay?\u003c/h3\u003e\n\u003cp\u003eIf you experience a technical issue, contact customer support immediately with details about the game and issue. Our team will investigate and resolve any problems with your gameplay or coin balance.\u003c/p\u003e\n&quot;,&quot;position&quot;:0},{&quot;id&quot;:29413538049180,&quot;section_id&quot;:29389414007836,&quot;title&quot;:&quot;What is CoinsRaid and how it works?&quot;,&quot;body&quot;:&quot;\u003cp\u003e\u003cstrong\u003eCoinsRaid\u003c/strong\u003e is an online social entertainment platform where players can enjoy fun, interactive games, complete missions, and earn rewards through play.\u003c/p\u003e\n\u003cp\u003eIt’s built to give you an exciting, fair, and transparent gaming experience — all from your browser or mobile device.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eA New Kind of Play Experience\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eCoinsRaid combines the best parts of gaming and rewards into one platform.\u003c/p\u003e\n\u003cp\u003eHere you can:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ePlay a variety of fast, easy-to-learn games.\u003c/li\u003e\n\u003cli\u003eProgress through missions and earn XP for achievements.\u003c/li\u003e\n\u003cli\u003eTake part in events and challenges.\u003c/li\u003e\n\u003cli\u003eCollect rewards that can later be redeemed\u003cstrong\u003e*\u003c/strong\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eEvery feature is designed to make gameplay enjoyable and social, without pressure or risk.\u003c/p\u003e\n\u003cp\u003e\u003cem\u003e*For current redemption procedures and processing timelines, reach out to customer support. Processing time may vary depending on \u003ca href=\&quot;https://coinsraidcom.zendesk.com/hc/en-us/articles/29414547757724-How-to-Verify-Your-Account\&quot;\u003e\u003cstrong\u003everification\u003c/strong\u003e\u003c/a\u003e and compliance status.\u003c/em\u003e\u003c/p\u003e\n&quot;,&quot;position&quot;:0},{&quot;id&quot;:29414547700892,&quot;section_id&quot;:29389820317468,&quot;title&quot;:&quot;Why Is My Account Restricted or Suspended?&quot;,&quot;body&quot;:&quot;\u003cp\u003eYour CoinsRaid account may be temporarily or permanently restricted for a few reasons, usually related to security, verification, or compliance requirements. These measures help keep gameplay fair and protect both players and the platform.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eCommon reasons for account restrictions:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\n\u003cstrong\u003eIdentity verification not completed:\u003c/strong\u003e Your KYC (Know Your Customer) check may still be pending or incomplete. Verification is required before redeeming prizes or continuing gameplay.\u003c/li\u003e\n\u003cli\u003e\n\u003cstrong\u003eMultiple declined payments:\u003c/strong\u003e Repeated failed or declined Gold Coin purchase attempts can trigger a temporary restriction to protect against payment fraud.\u003c/li\u003e\n\u003cli\u003e\n\u003cstrong\u003eDuplicate or linked accounts:\u003c/strong\u003e Only one CoinsRaid account is allowed per person or household. Duplicate accounts are automatically flagged and reviewed by Compliance.\u003c/li\u003e\n\u003cli\u003e\n\u003cstrong\u003eResponsible play limits:\u003c/strong\u003e If you’ve set a timeout, purchase limit, or self-exclusion, your account will remain restricted until the selected period ends.\u003c/li\u003e\n\u003cli\u003e\n\u003cstrong\u003eFraud or unusual activity:\u003c/strong\u003e Accounts flagged by our security systems for suspicious or automated behavior may be paused for manual review.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cdiv style=\&quot;background:#f5f5f5;border-left:4px solid #999;padding:12px 16px;margin:16px 0;border-radius:4px;\&quot;\u003e⚠️ Always use your own verified details, keep payment information consistent, and avoid using VPNs or shared devices to prevent automatic restrictions.\u003c/div\u003e\n&quot;,&quot;position&quot;:1},{&quot;id&quot;:29414484180124,&quot;section_id&quot;:29389812953116,&quot;title&quot;:&quot;Why Did My Coins or Balance Expire?&quot;,&quot;body&quot;:&quot;\u003cp\u003eIf your Sweeps Coins (SC) balance has disappeared or decreased, it may have expired due to inactivity.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eHere’s how expiration works:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eSweeps Coins (SC) expire after \u003cstrong\u003e60 consecutive days of inactivity\u003c/strong\u003e.\u003c/li\u003e\n\u003cli\u003eInactivity means no login, gameplay with Gold or Sweeps Coins, or prize redemption attempts during that time.\u003c/li\u003e\n\u003cli\u003eOnce SC expire, they \u003cstrong\u003ecan’t be restored\u003c/strong\u003e, even if you log in again later.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eGold Coins (GC)\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eGold Coins never expire.\u003c/li\u003e\n\u003cli\u003eHowever, they have no monetary value and can’t be redeemed for prizes.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eHow to keep your account active:\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eSimply log in or play any game at least once every 60 days to keep your Sweeps Coins safe and active.\u003c/p\u003e\n&quot;,&quot;position&quot;:1},{&quot;id&quot;:29414500391452,&quot;section_id&quot;:29389820317468,&quot;title&quot;:&quot;Can I Have More Than One Account?&quot;,&quot;body&quot;:&quot;\u003cp\u003eShort answer — \u003cstrong\u003eNo\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eEach player can only have \u003cstrong\u003eone CoinsRaid account\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eDuplicate, shared, or linked accounts, including those created by the same individual under different credentials, are strictly prohibited.\u003c/p\u003e\n\u003cp\u003eThis rule helps keep gameplay fair and protects everyone from fraud or abuse. Our security systems automatically detect duplicate or linked accounts through device, IP, and identity checks.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eIf more than one account is detected:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eAll related accounts may be suspended or permanently closed.\u003c/li\u003e\n\u003cli\u003eAny associated balances or prizes may be forfeited in accordance with the Fraud Prevention \u0026amp; Bonus Abuse Policy.\u003c/li\u003e\n\u003c/ul\u003e\n&quot;,&quot;position&quot;:2},{&quot;id&quot;:29414547615388,&quot;section_id&quot;:29389812953116,&quot;title&quot;:&quot;Alternate Method of Entry (AMOE) - Play for Free&quot;,&quot;body&quot;:&quot;\u003cp\u003eYou don’t need to make a purchase to play or win on CoinsRaid.\u003c/p\u003e\n\u003cp\u003eEvery player has access to our \u003cstrong\u003eAlternate Method of Entry (AMOE)\u003c/strong\u003e — a completely free way to earn Sweeps Coins (SC).\u003c/p\u003e\n\u003cp\u003eKeep in mind AMOE is only available for users with \u003cstrong\u003eno funds\u003c/strong\u003e in their Sweeps Coins wallets. If you have funds, please use them first.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eHow it works:\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eGo to the \u003ca href=\&quot;https://coinsraid.com/amoe\&quot;\u003e\u003cstrong\u003eAMOE Portal\u003c/strong\u003e\u003c/a\u003e on our website.\u003c/li\u003e\n\u003cli\u003eComplete the online AMOE form with your full name, email, mailing address, and date of birth.\u003c/li\u003e\n\u003cli\u003eGenerate and print your pre-filled entry with a QR code.\u003c/li\u003e\n\u003cli\u003eMail your printed entry to the address provided in the instructions.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eOnce verified, you’ll receive \u003cstrong\u003e1 Sweeps Coin (SC)\u003c/strong\u003e credited to your account for each valid mail-in entry. These coins work exactly the same as all other SC — they can be used in promotional games and redeemed once verified.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eImportant notes:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eThere’s \u003cstrong\u003eno purchase or payment required\u003c/strong\u003e to enter or win.\u003c/li\u003e\n\u003cli\u003eYou can submit multiple entries unless otherwise limited by ongoing promotions.\u003c/li\u003e\n\u003cli\u003eAMOE entries have the same odds of winning as any other method of obtaining SC.\u003c/li\u003e\n\u003cli\u003eAMOE entries are processed after verification and may take some time.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIf you prefer, you may also handwrite your AMOE entry following the same format — as long as it includes your personal details and a signed acknowledgment of CoinsRaid’s Terms of Use.\u003c/p\u003e\n&quot;,&quot;position&quot;:2},{&quot;id&quot;:29414532276252,&quot;section_id&quot;:29389414007836,&quot;title&quot;:&quot;How to Create Your CoinsRaid Account&quot;,&quot;body&quot;:&quot;\u003cp\u003eGetting started with CoinsRaid takes just a few minutes. You can create your account directly from your browser and start playing right away. No downloads or complex setup required.\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\n\u003cstrong\u003eGo to the \u003ca href=\&quot;https://coinsraid.com/\&quot;\u003eCoinsRaid\u003c/a\u003e website.\u003c/strong\u003e\u003cbr\u003eClick \&quot;\u003cstrong\u003eRegister\u003c/strong\u003e\&quot; on the homepage.\u003c/li\u003e\n\u003cli\u003e\n\u003cstrong\u003eEnter your details.\u003c/strong\u003e\u003cbr\u003eProvide a valid \u003cstrong\u003eFirst name\u003c/strong\u003e and \u003cstrong\u003eLast name\u003c/strong\u003e, email address, choose a password, agree to the Terms and Conditions and click \&quot;\u003cstrong\u003eConfirm\u003c/strong\u003e\&quot;.\u003c/li\u003e\n\u003cli\u003e\n\u003cstrong\u003eVerify your email.\u003c/strong\u003e\u003cbr\u003eYou’ll receive a short confirmation link. Open it to activate your account.\u003c/li\u003e\n\u003cli\u003e\n\u003cstrong\u003eSet up your profile.\u003c/strong\u003e\u003cbr\u003ePick a username, choose an avatar, and explore your dashboard. You can update these details anytime in Profile.\u003c/li\u003e\n\u003cli\u003e\n\u003cstrong\u003eStart playing.\u003c/strong\u003e\u003cbr\u003eOnce your account is active, you can explore games, complete missions, and earn rewards immediately.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eBefore redeeming prizes, you may be asked to \u003ca href=\&quot;https://coinsraidcom.zendesk.com/hc/en-us/articles/29414547757724-How-to-Verify-Your-Account\&quot;\u003e\u003cstrong\u003everify\u003c/strong\u003e\u003c/a\u003e your identity to confirm age and location. This helps keep \u003cstrong\u003eCoinsRaid\u003c/strong\u003e fair, secure, and open only to eligible players.\u003c/p\u003e\n&quot;,&quot;position&quot;:2},{&quot;id&quot;:29414547757724,&quot;section_id&quot;:29389820317468,&quot;title&quot;:&quot;How to Verify Your Account&quot;,&quot;body&quot;:&quot;\u003cp\u003eBefore you can redeem prizes or take part in certain features, your CoinsRaid account needs to be verified. Verification confirms that each player is of legal age and located in an eligible region.\u003c/p\u003e\n\u003cdiv style=\&quot;background:#f5f5f5;border-left:4px solid #999;padding:12px 16px;margin:16px 0;border-radius:4px;\&quot;\u003e❗ For your safety, please \u003cstrong\u003edon’t send\u003c/strong\u003e any ID photos, documents, or personal details in chat, email or any other place except \u003cstrong\u003eShufti Pro\u003c/strong\u003e.\u003c/div\u003e\n\u003cdiv style=\&quot;background:#f5f5f5;border-left:4px solid #999;padding:12px 16px;margin:16px 0;border-radius:4px;\&quot;\u003e⚠️ Verification should only be done through the secure \u003cstrong\u003eShufti Pro\u003c/strong\u003e link inside \u003ca href=\&quot;https://coinsraid.com/profile?tab=KYC\&quot;\u003e\u003cstrong\u003eYour Account\u003c/strong\u003e\u003c/a\u003e.\u003c/div\u003e\n\u003cp\u003e\u003cstrong\u003e1. Open your account settings\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eGo to the My Profile menu and select \&quot;\u003cstrong\u003eKYC\u003c/strong\u003e\&quot;. You can also access this directly at: \u003ca href=\&quot;https://coinsraid.com/profile?tab=KYC\&quot;\u003ecoinsraid.com/profile?tab=KYC\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2. Submit your information\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eYou’ll be asked to provide:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eFull legal name\u003c/li\u003e\n\u003cli\u003eDate of birth\u003c/li\u003e\n\u003cli\u003eA valid government-issued photo ID\u003c/li\u003e\n\u003cli\u003eProof of address (for example, a utility bill or official document)\u003c/li\u003e\n\u003cli\u003eResidential address\u003c/li\u003e\n\u003cli\u003eA unique identification number such as a national ID or tax ID\u003c/li\u003e\n\u003c/ul\u003e\n\u003cdiv style=\&quot;background:#f5f5f5;border-left:4px solid #999;padding:12px 16px;margin:16px 0;border-radius:4px;\&quot;\u003e💡 Additional documents or information may be requested if required for enhanced verification or compliance purposes.\u003c/div\u003e\n\u003cp\u003e\u003cstrong\u003e3. Wait for confirmation\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eVerification usually takes some time once your documents are submitted. You’ll receive an email when your account is confirmed.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e4. Why verification matters\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eIt helps ensure that:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eOnly eligible players can redeem prizes\u003c/li\u003e\n\u003cli\u003eEach account belongs to a real person\u003c/li\u003e\n\u003cli\u003eThe platform stays safe and secure for everyone\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eOnce verified, your account is fully active, and you can continue playing, joining events, and redeeming prizes.\u003c/p\u003e\n&quot;,&quot;position&quot;:3},{&quot;id&quot;:29414515782684,&quot;section_id&quot;:29389812953116,&quot;title&quot;:&quot;How to Earn Sweeps Coins (SC)&quot;,&quot;body&quot;:&quot;\u003cp\u003eSweeps Coins (SC) are free promotional entries that let you play sweepstakes-eligible games and redeem prizes. You can collect them in several easy ways, with no purchase required.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eWays to earn SC:\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\n\u003cstrong\u003eDaily Login Rewards\u003c/strong\u003e\u003cbr\u003eLog in each day to claim free SC as part of your daily reward streak. The longer your streak, the better the rewards.\u003c/li\u003e\n\u003cli\u003e\n\u003cstrong\u003eMissions and Challenges\u003c/strong\u003e\u003cbr\u003eComplete in-game missions or limited-time challenges to earn Bonus SC. You’ll find these under the \&quot;Missions\&quot; tab on your CoinsRaid dashboard.\u003c/li\u003e\n\u003cli\u003e\n\u003cstrong\u003ePromotional Events and Giveaways\u003c/strong\u003e\u003cbr\u003eJoin special events, social promotions, or loyalty milestones to receive additional SC. Keep an eye on your inbox and notifications for limited-time campaigns.\u003c/li\u003e\n\u003cli\u003e\n\u003cstrong\u003eGold Coin Bundles (Free Gift)\u003c/strong\u003e\u003cbr\u003eWhen you buy Gold Coins (GC) for entertainment play, you’ll often receive a \u003cstrong\u003efree gift of SC\u003c/strong\u003e with your purchase. SC are never sold directly. They’re always provided as a free bonus.\u003c/li\u003e\n\u003cli\u003e\n\u003cstrong\u003eAlternate Method of Entry (AMOE)\u003c/strong\u003e\u003cbr\u003eYou can always earn SC for free by submitting a mail-in entry through our \u003ca href=\&quot;https://coinsraidcom.zendesk.com/hc/en-us/articles/29414547615388-Alternate-Method-of-Entry-AMOE-Play-for-Free\&quot;\u003eAMOE process\u003c/a\u003e. Each valid entry gives you \u003cstrong\u003e1 SC\u003c/strong\u003e, and these coins work exactly the same as all others.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u003cstrong\u003eImportant:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eSC can’t be purchased directly, traded, or transferred between accounts.\u003c/li\u003e\n\u003cli\u003eAll SC are promotional and hold no cash value until they become \u003cstrong\u003eRedeemable SC\u003c/strong\u003e through gameplay and verification.\u003c/li\u003e\n\u003c/ul\u003e\n&quot;,&quot;position&quot;:3},{&quot;id&quot;:29414532301084,&quot;section_id&quot;:29389414007836,&quot;title&quot;:&quot;How to Play on CoinsRaid&quot;,&quot;body&quot;:&quot;\u003cp\u003ePlaying on CoinsRaid is quick and simple. You can start enjoying games right after signing up — no downloads or setup needed.\u003c/p\u003e\n\u003ch2\u003e1. Log In to Your Account\u003c/h2\u003e\n\u003cp\u003eVisit the \u003ca href=\&quot;https://coinsraid.com/\&quot;\u003e\u003cstrong\u003eCoinsRaid\u003c/strong\u003e\u003c/a\u003e website and log in using your registered email and password. If you’re new, you can create an account in just a few minutes.\u003c/p\u003e\n\u003ch2\u003e2. Explore the Game Library\u003c/h2\u003e\n\u003cp\u003eFrom your dashboard, browse through the available games. Each game has its own theme, style, and mechanics, but all are built for entertainment and social play.\u003c/p\u003e\n\u003ch2\u003e3. Choose How You Want to Play\u003c/h2\u003e\n\u003cp\u003eYou can play using different types of coins:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\n\u003cstrong\u003eGold Coins\u003c/strong\u003e let you play for fun and practice.\u003c/li\u003e\n\u003cli\u003e\n\u003cstrong\u003eSweeps Coins\u003c/strong\u003e allow you to take part in sweepstakes-style gameplay for prizes once your account is verified.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eYou can switch between the two modes anytime before starting a game.\u003c/p\u003e\n\u003ch2\u003e4. Earn Progress and Rewards\u003c/h2\u003e\n\u003cp\u003eEvery round you play helps you earn XP, complete missions, and unlock rewards. XP tracks your journey on \u003cstrong\u003eCoinsRaid\u003c/strong\u003e — it’s your way of seeing progress and achievement over time.\u003c/p\u003e\n\u003ch2\u003e5. Join Missions and Events\u003c/h2\u003e\n\u003cp\u003eKeep an eye on community challenges and limited-time events. These offer extra rewards and are a fun way to explore new games and compete with other players.\u003c/p\u003e\n\u003ch2\u003e6. Play Responsibly\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eCoinsRaid\u003c/strong\u003e includes tools to help you set limits, take breaks, or pause your account whenever you need. For more information check \u003ca href=\&quot;https://coinsraidcom.zendesk.com/hc/en-us/articles/29414547500700-Responsible-Play-Basics\&quot;\u003eResponsible Play Basics\u003c/a\u003e and \u003ca href=\&quot;https://coinsraidcom.zendesk.com/hc/en-us/articles/29414532635676-Responsible-Gaming-How-It-Works\&quot;\u003eResponsible Gaming: How It Works\u003c/a\u003e.\u003c/p\u003e\n&quot;,&quot;position&quot;:3},{&quot;id&quot;:29414515917084,&quot;section_id&quot;:29389820317468,&quot;title&quot;:&quot;How to Reset Your Password&quot;,&quot;body&quot;:&quot;\u003cp\u003eYou can access your CoinsRaid account anytime from your browser on desktop or mobile. Logging in and recovering access are quick and secure.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eResetting Your Password\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eIf you’ve forgotten your password:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eGo to the \u003ca href=\&quot;https://coinsraid.com/\&quot;\u003e\u003cstrong\u003eCoinsRaid\u003c/strong\u003e\u003c/a\u003e website.\u003c/li\u003e\n\u003cli\u003eClick \&quot;\u003cstrong\u003eLog In\u003c/strong\u003e\&quot; on the homepage.\u003c/li\u003e\n\u003cli\u003eClick \&quot;\u003cstrong\u003eForgot your password?\u003c/strong\u003e\&quot; on the login screen.\u003c/li\u003e\n\u003cli\u003eEnter your registered email address.\u003c/li\u003e\n\u003cli\u003eCheck your inbox for a password reset link.\u003c/li\u003e\n\u003cli\u003eCreate a new password and confirm it.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u003cstrong\u003eAccount Security Tips\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eUse a strong, unique password that you don’t share elsewhere.\u003c/li\u003e\n\u003cli\u003eAvoid saving passwords on public or shared devices.\u003c/li\u003e\n\u003cli\u003eIf you suspect someone has accessed your account, change your password immediately and contact Support.\u003c/li\u003e\n\u003c/ul\u003e\n&quot;,&quot;position&quot;:4},{&quot;id&quot;:29414532464028,&quot;section_id&quot;:29389812953116,&quot;title&quot;:&quot;How to Redeem Prizes&quot;,&quot;body&quot;:&quot;\u003cp\u003eRedeeming prizes on CoinsRaid is simple and secure. Follow the steps below to request your redemption and receive your rewards safely.\u003c/p\u003e\n\u003ch2\u003e1. Make Sure You’re Eligible\u003c/h2\u003e\n\u003cp\u003eBefore you can redeem, please check that:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eYou’ve completed \u003cstrong\u003eKYC verification\u003c/strong\u003e (identity, address, and liveness check).\u003c/li\u003e\n\u003cli\u003eYou’re physically located in an \u003cstrong\u003eeligible U.S. state\u003c/strong\u003e.\u003c/li\u003e\n\u003cli\u003eYou’re redeeming \u003cstrong\u003eSweeps Coins (SC)\u003c/strong\u003e that have become \u003cstrong\u003eRedeemable SC\u003c/strong\u003e — meaning they’ve met the 1× playthrough on eligible slot games.\u003c/li\u003e\n\u003cli\u003eYour account is active and not under self-exclusion or review.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cdiv style=\&quot;background:#f5f5f5;border-left:4px solid #999;padding:12px 16px;margin:16px 0;border-radius:4px;\&quot;\u003e⚠️ Please note that the minimum amount required for redemption is $100.\u003c/div\u003e\n\u003cp\u003e\u003cem\u003e(If you haven’t completed verification yet, you can do it directly from your Profile page — see \u003ca href=\&quot;https://coinsraidcom.zendesk.com/hc/en-us/articles/29414547757724-How-to-Verify-Your-Account\&quot;\u003eHow to Verify Your Account\u003c/a\u003e.)\u003c/em\u003e\u003c/p\u003e\n\u003ch2\u003e2. Submit a Redemption Request\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eGo to your \u003cstrong\u003eRedeem Page\u003c/strong\u003e.\u003c/li\u003e\n\u003cli\u003eSelect eligible Redeemable SC.\u003c/li\u003e\n\u003cli\u003eConfirm your request — you’ll see a confirmation message once it’s received.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e3. Verification \u0026amp; Review\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eEvery redemption request is checked automatically to confirm eligibility and identity.\u003c/li\u003e\n\u003cli\u003eIf your KYC verification is complete and there are no issues, your redemption will move straight to processing.\u003c/li\u003e\n\u003cli\u003eIf additional verification is required, we’ll email you right away with clear instructions.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cem\u003e(Please don’t send documents over chat or email — use the secure upload link we provide.)\u003c/em\u003e\u003c/p\u003e\n\u003ch2\u003e4. Processing Time\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eOnce approved, redemptions are \u003cstrong\u003etypically processed within 3 business days\u003c/strong\u003e after KYC approval.\u003c/li\u003e\n\u003cli\u003eSome requests may take longer if additional compliance checks are needed (for example, payment partner review or fraud screening).\u003c/li\u003e\n\u003cli\u003eYou’ll receive an email notification once your redemption is completed.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e5. Important Rules\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eRedemptions are only available for \u003cstrong\u003eRedeemable SC\u003c/strong\u003e — Gold Coins cannot be redeemed.\u003c/li\u003e\n\u003cli\u003eFor players in \u003cstrong\u003eNew York or Florida\u003c/strong\u003e, each individual redemption is limited to \u003cstrong\u003e$5,000 or less\u003c/strong\u003e.\u003c/li\u003e\n\u003cli\u003eCoinsRaid may request additional documentation if required by law or payment partners.\u003c/li\u003e\n\u003cli\u003eAnnual redemptions over \u003cstrong\u003e$600\u003c/strong\u003e may require IRS Form 1099 for tax purposes.\u003c/li\u003e\n\u003cli\u003eAll redemptions are final once processed.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e6. Common Questions\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eWhy is my redemption still pending?\u003c/strong\u003e\u003cbr\u003eMost likely your KYC or compliance review is still in progress. You’ll be notified once it’s cleared.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eCan I redeem if I only use AMOE (mail-in entries)?\u003c/strong\u003e\u003cbr\u003eYes — AMOE players follow the same redemption process once their identity is verified.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eCan I cancel or change a redemption request?\u003c/strong\u003e\u003cbr\u003eOnce submitted and under review, redemptions can’t be modified. If you need help, contact Support.\u003c/p\u003e\n&quot;,&quot;position&quot;:4},{&quot;id&quot;:29414547500700,&quot;section_id&quot;:29389414007836,&quot;title&quot;:&quot;Responsible Play Basics&quot;,&quot;body&quot;:&quot;\u003cp\u003eAt CoinsRaid, we want gameplay to stay fun, social, and balanced. While CoinsRaid doesn’t involve real-money gambling, we still provide tools that help you manage your time and spending in a healthy way.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eHere’s how you can stay in control:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\n\u003cstrong\u003eTake breaks or timeouts:\u003c/strong\u003e You can pause play for a chosen period (from 24 hours up to 1 year). During a timeout, your account remains safe, and you’ll regain access automatically afterward.\u003c/li\u003e\n\u003cli\u003e\n\u003cstrong\u003eSelf-exclusion:\u003c/strong\u003e If you ever need a longer break, you can self-exclude temporarily or permanently. While excluded, you can’t log in, purchase coins, or redeem prizes.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cdiv style=\&quot;background:#f5f5f5;border-left:4px solid #999;padding:12px 16px;margin:16px 0;border-radius:4px;\&quot;\u003e🚑 If you ever feel your play habits are affecting your well-being, you can take a break at any time using our \u003ca href=\&quot;https://coinsraidcom.zendesk.com/hc/en-us/articles/29414532635676-Responsible-Gaming-How-It-Works\&quot;\u003eResponsible Gaming tools\u003c/a\u003e.\u003c/div\u003e\n\u003cp\u003eIf you need additional support, you’ll find helpful gaming and digital wellness resources listed below, including organizations that specialize in managing screen time, gaming habits, and online behavior.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eThe Center for Internet and Technology Addiction: \u003ca href=\&quot;https://netaddiction.com/\&quot;\u003ehttps://netaddiction.com/\u003c/a\u003e\n\u003c/li\u003e\n\u003cli\u003eDigital Wellness Institute: \u003ca href=\&quot;https://www.digitalwellnessinstitute.com/\&quot;\u003ehttps://www.digitalwellnessinstitute.com/\u003c/a\u003e\n\u003c/li\u003e\n\u003cli\u003eRestart Life (Internet \u0026amp; Gaming Addiction Treatment): \u003ca href=\&quot;https://www.restartlife.com/\&quot;\u003ehttps://www.restartlife.com/\u003c/a\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eRemember — CoinsRaid is about having fun. Take breaks, enjoy the games, and play responsibly.\u003c/p\u003e\n&quot;,&quot;position&quot;:4},{&quot;id&quot;:29414532609308,&quot;section_id&quot;:29389820317468,&quot;title&quot;:&quot;How to Update Your Account Information&quot;,&quot;body&quot;:&quot;\u003cp\u003eYou can view and manage your account details anytime from your CoinsRaid profile page.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTo update your information:\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eLog in to your \u003cstrong\u003eCoinsRaid\u003c/strong\u003e account.\u003c/li\u003e\n\u003cli\u003eGo to \u003cstrong\u003eMy Profile\u003c/strong\u003e.\u003c/li\u003e\n\u003cli\u003eUpdate any editable fields.\u003c/li\u003e\n\u003cli\u003eClick \u003cstrong\u003eSave\u003c/strong\u003e to confirm.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u003cstrong\u003eImportant:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eOnce your account has been verified through our KYC process, certain details (like your full name, date of birth, and country) cannot be changed for security and compliance reasons.\u003c/li\u003e\n\u003cli\u003eIf you need to correct a mistake in verified information, please contact our Support Team via live chat.\u003c/li\u003e\n\u003cli\u003eMake sure your email and phone number are always up to date so you can receive important account and verification notifications.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cdiv style=\&quot;background:#f5f5f5;border-left:4px solid #999;padding:12px 16px;margin:16px 0;border-radius:4px;\&quot;\u003e💡 Use a strong password and update it regularly to keep your account secure.\u003c/div\u003e\n&quot;,&quot;position&quot;:5},{&quot;id&quot;:29414515682716,&quot;section_id&quot;:29389414007836,&quot;title&quot;:&quot;Supported Devices and Access&quot;,&quot;body&quot;:&quot;\u003cp\u003eYou can enjoy CoinsRaid directly from your web browser. No downloads or installations are required. The platform is fully optimized for both desktop and mobile browsers, so you can play anytime, anywhere.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eCurrently supported:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\n\u003cstrong\u003eDesktop browsers:\u003c/strong\u003e Chrome, Edge, Firefox, and Safari (latest versions recommended).\u003c/li\u003e\n\u003cli\u003e\n\u003cstrong\u003eMobile browsers:\u003c/strong\u003e Safari on iOS and Chrome on Android.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eCoinsRaid is also compatible with other modern browsers, as long as they are regularly updated and support standard web technologies (HTML5 and WebGL).\u003c/p\u003e\n\u003cdiv style=\&quot;background:#f5f5f5;border-left:4px solid #999;padding:12px 16px;margin:16px 0;border-radius:4px;\&quot;\u003e📵 At this time, CoinsRaid does not have a dedicated Android or iOS app. You can still access the full experience through your mobile browser.\u003c/div\u003e\n\u003cp\u003eA native mobile app may be introduced later, but there’s no confirmed release date yet. Updates will be shared on our official channels when available.\u003c/p\u003e\n\u003cp\u003eFor the best performance, always keep your browser updated and allow cookies and location services.\u003c/p\u003e\n&quot;,&quot;position&quot;:5},{&quot;id&quot;:29414532635676,&quot;section_id&quot;:29389820317468,&quot;title&quot;:&quot;Responsible Gaming: How It Works&quot;,&quot;body&quot;:&quot;\u003cp\u003eSelf-Exclusion, Purchase Limit and Bet Limit are CoinsRaid’s responsible play tools designed to help you take a break from the platform whenever you need it. You can activate them at any time directly from your \u003ca href=\&quot;https://coinsraid.com/self-exclusion\&quot;\u003e\u003cstrong\u003eaccount settings\u003c/strong\u003e\u003c/a\u003e.\u003c/p\u003e\n\u003cdiv style=\&quot;background:#f5f5f5;border-left:4px solid #999;padding:12px 16px;margin:16px 0;border-radius:4px;\&quot;\u003e⚠️ \u003cstrong\u003eBefore you self-exclude, please make sure you’ve redeemed any eligible prizes, since you won’t be able to access your account while the exclusion is active.\u003c/strong\u003e\n\u003c/div\u003e\n\u003ch2\u003eWhat Self-Exclusion Does\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eBlocks access to your account for the duration you choose:\u003cbr\u003e\u003cem\u003e24 hours, 1 week, 1 month, 6 months, 1 year or Permanently\u003c/em\u003e\n\u003c/li\u003e\n\u003cli\u003ePrevents login, gameplay, Gold Coin purchases, and prize redemptions.\u003c/li\u003e\n\u003cli\u003eApplies instantly to your identity.\u003c/li\u003e\n\u003cli\u003eEnsures long-term safety.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cdiv style=\&quot;background:#f5f5f5;border-left:4px solid #999;padding:12px 16px;margin:16px 0;border-radius:4px;\&quot;\u003e❗ \u003cstrong\u003ePermanent self-exclusion requests cannot be reversed.\u003c/strong\u003e\n\u003c/div\u003e\n\u003ch2\u003eWhat Purchase Limit Does\u003c/h2\u003e\n\u003cp\u003ePurchase Limits allow you to control how much you spend on Gold Coins.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\n\u003cstrong\u003eDaily Purchase Limit\u003c/strong\u003e\u003cbr\u003eEnter the maximum amount you can spend in a single day.\u003c/li\u003e\n\u003cli\u003e\n\u003cstrong\u003eWeekly Purchase Limit\u003c/strong\u003e\u003cbr\u003eEnter the maximum amount you can spend in a week.\u003c/li\u003e\n\u003cli\u003e\n\u003cstrong\u003eMonthly Purchase Limit\u003c/strong\u003e\u003cbr\u003eEnter the maximum amount you can spend in a month.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eOnce set, purchases cannot exceed these limits. Lowering a limit applies immediately.\u003c/p\u003e\n\u003ch2\u003eWhat Bet Limit Does\u003c/h2\u003e\n\u003cp\u003eGameplay Limits help you manage how much you play.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\n\u003cstrong\u003eDaily Bet Limit\u003c/strong\u003e\u003cbr\u003eEnter the maximum amount you can play in one day.\u003c/li\u003e\n\u003cli\u003e\n\u003cstrong\u003eWeekly Bet Limit\u003c/strong\u003e\u003cbr\u003eEnter the maximum amount you can play in a week.\u003c/li\u003e\n\u003cli\u003e\n\u003cstrong\u003eMonthly Bet Limit\u003c/strong\u003e\u003cbr\u003eEnter the maximum amount you can play in a month.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eWhen a bet limit is reached, gameplay will be restricted until the limit resets.\u003c/p\u003e\n&quot;,&quot;position&quot;:6},{&quot;id&quot;:29414547537436,&quot;section_id&quot;:29389414007836,&quot;title&quot;:&quot;How to get Support&quot;,&quot;body&quot;:&quot;\u003cp\u003eBefore contacting support, we recommend checking our \u003ca href=\&quot;https://coinsraidcom.zendesk.com/hc/en-us\&quot;\u003e\u003cstrong\u003eHelp Center\u003c/strong\u003e\u003c/a\u003e — it contains answers to most common questions about accounts, gameplay, verification, prizes, responsible play, and more.\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eVisit our \u003ca href=\&quot;https://coinsraidcom.zendesk.com/hc/en-us\&quot;\u003e\u003cstrong\u003eHelp Center\u003c/strong\u003e\u003c/a\u003e.\u003c/li\u003e\n\u003cli\u003eBrowse categories or use the search bar to quickly find the information you need.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eIf you can’t find your answer or still need assistance:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eGo to the CoinsRaid website at \u003ca href=\&quot;https://coinsraid.com/\&quot;\u003e\u003cstrong\u003ehttps://coinsraid.com\u003c/strong\u003e\u003c/a\u003e.\u003c/li\u003e\n\u003cli\u003eLook for the help widget in the bottom-right corner of the screen.\u003c/li\u003e\n\u003cli\u003eClick the widget to open the chat window.\u003c/li\u003e\n\u003cli\u003eChoose a topic in the Help Center or click \&quot;\u003cstrong\u003eAsk for help\u003c/strong\u003e\&quot; to type your question in the chat box.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eOur team is available 24/7 to help with account questions, verification, technical issues, responsible play tools, and anything else you need.\u003c/p\u003e\n\u003cp\u003eYou can also reach us by email at \u003ca href=\&quot;mailto:support@coinsraid.com\&quot;\u003e\u003cstrong\u003esupport@coinsraid.com\u003c/strong\u003e\u003c/a\u003e, but the fastest and most reliable way to receive help is through the chat widget.\u003c/p\u003e\n&quot;,&quot;position&quot;:6},{&quot;id&quot;:29414547866524,&quot;section_id&quot;:29389820317468,&quot;title&quot;:&quot;Keeping Your Account Secure&quot;,&quot;body&quot;:&quot;\u003cp\u003eAt CoinsRaid, we take account security seriously and provide tools and best practices to help you protect your information. Here’s how you can keep your account safe:\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e1. Use a strong, unique password\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eChoose a password that includes letters, numbers, and symbols. Avoid using personal details (like your name or birthday) or reusing passwords from other sites.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2. Never share your login details\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eYour CoinsRaid account is personal. Don’t share your password, verification codes, or account access with anyone, including people claiming to be CoinsRaid staff. Our team will never ask for your password or one-time codes.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e3. Keep your email secure\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eYour email is the key to your account. Use a strong password for your email address and enable two-factor authentication (2FA) with your email provider whenever possible.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e4. Avoid suspicious links or messages\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eAlways access CoinsRaid directly through \u003ca href=\&quot;https://coinsraid.com/\&quot;\u003e\u003cstrong\u003ecoinsraid.com\u003c/strong\u003e\u003c/a\u003e. If you receive a message or email that looks suspicious, do not click any links. Report it to \u003ca href=\&quot;mailto:support@coinsraid.com\&quot;\u003e\u003cstrong\u003esupport@coinsraid.com\u003c/strong\u003e\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e5. Stay logged in only on your own devices\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eLog out after using shared or public computers, and don’t save passwords on devices that aren’t yours.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e6. Keep your browser updated\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eUse the latest version of a supported browser to ensure your data is protected with the newest security standards.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eIf you think your account has been compromised:\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eContact our Support Team immediately — see \u003ca href=\&quot;https://coinsraidcom.zendesk.com/hc/en-us/articles/29414547537436-How-to-get-Support\&quot;\u003eHow to get Support\u003c/a\u003e.\u003c/p\u003e\n&quot;,&quot;position&quot;:7},{&quot;id&quot;:29414532687644,&quot;section_id&quot;:29389820317468,&quot;title&quot;:&quot;Email or Login Issues&quot;,&quot;body&quot;:&quot;\u003cp\u003e\u003cstrong\u003e1. Check your email inbox and spam folder\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eVerification or password reset emails may sometimes end up in the spam or promotions folder. Search for messages from \u003ca href=\&quot;mailto:noreply@coinsraid.com\&quot;\u003e\u003cstrong\u003enoreply@coinsraid.com\u003c/strong\u003e\u003c/a\u003e or \u003ca href=\&quot;mailto:admin@coinsraid.com\&quot;\u003e\u003cstrong\u003eadmin@coinsraid.com\u003c/strong\u003e\u003c/a\u003e and mark them as \&quot;Not Spam.\&quot;\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2. Make sure you’re using the correct login method\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eIf you registered using Google or Apple, you’ll need to sign in using the same method. Email and social logins are separate.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e3. Verify your email address\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eIf you haven’t confirmed your email yet, look for the verification link we sent after registration. Click the link to complete verification before trying to log in again.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e4. Clear your browser cache or try another device\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eSometimes login issues are caused by old session data. Try refreshing your browser or logging in from another device.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e5. Contact Support if you’re still locked out\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eIf none of the steps above work, reach out to our Support Team at \u003ca href=\&quot;mailto:support@coinsraid.com\&quot;\u003e\u003cstrong\u003esupport@coinsraid.com\u003c/strong\u003e\u003c/a\u003e. Please include the email address linked to your account and any error messages you’re seeing. This will help us assist you faster.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTip:\u003c/strong\u003e Always make sure you log in only through \u003ca href=\&quot;https://coinsraid.com/\&quot;\u003e\u003cstrong\u003ecoinsraid.com\u003c/strong\u003e\u003c/a\u003e and avoid third-party or unofficial links.\u003c/p\u003e\n&quot;,&quot;position&quot;:8},{&quot;id&quot;:29414484527516,&quot;section_id&quot;:29389820317468,&quot;title&quot;:&quot;How to Delete or Close Your Account&quot;,&quot;body&quot;:&quot;\u003cp\u003eIf you decide to stop playing, you can request to permanently close your CoinsRaid account at any time.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTo request account closure:\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eContact our Support Team — see \u003ca href=\&quot;https://coinsraidcom.zendesk.com/hc/en-us/articles/29414547537436-How-to-get-Support\&quot;\u003eHow to get Support\u003c/a\u003e.\u003c/li\u003e\n\u003cli\u003eOur team will confirm your identity and verify that no pending redemptions or compliance reviews remain on your account.\u003c/li\u003e\n\u003cli\u003eOnce confirmed, your account will be permanently closed, and access to gameplay, purchases, and rewards will be removed.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u003cstrong\u003eBefore closing your account:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMake sure all prize redemptions have been completed.\u003c/li\u003e\n\u003cli\u003eAny remaining Gold Coins or unredeemed Sweeps Coins will be forfeited once the account is closed.\u003c/li\u003e\n\u003cli\u003eFor regulatory reasons, some account data (such as KYC and transaction records) will be securely retained for a limited period as required by law.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIf you simply want to take a break, consider using our \u003ca href=\&quot;https://coinsraidcom.zendesk.com/hc/en-us/articles/29414532635676-Responsible-Gaming-How-It-Works\&quot;\u003eResponsible Gaming tools\u003c/a\u003e instead — they temporarily pause your access without deleting your account.\u003c/p\u003e\n&quot;,&quot;position&quot;:9},{&quot;id&quot;:29414532732316,&quot;section_id&quot;:29389820317468,&quot;title&quot;:&quot;Why can\u0027t I redeem to a gift card or prepaid card?&quot;,&quot;body&quot;:&quot;\u003cdiv style=\&quot;background:#f5f5f5;border-left:4px solid #999;padding:12px 16px;margin:16px 0;border-radius:4px;\&quot;\u003e🚫 \u003cstrong\u003eGift cards\u003c/strong\u003e, \u003cstrong\u003estore credits\u003c/strong\u003e, and \u003cstrong\u003eprepaid cards\u003c/strong\u003e \u003cstrong\u003earen’t\u003c/strong\u003e available as payout options.\u003c/div\u003e\n\u003cp\u003eBefore any prize can be redeemed, we’re required by law to verify your identity and location.\u003c/p\u003e\n\u003cp\u003eGift cards and prepaid cards don’t allow us to do it, so we can’t use them for redemptions.\u003c/p\u003e\n\u003cp\u003eRedemptions are only available in eligible U.S. states. If you’re in a restricted state, redemption options won’t appear.\u003c/p\u003e\n\u003ch2\u003eWhat can I redeem instead?\u003c/h2\u003e\n\u003cp\u003eOnce your Sweeps Coins are redeemable, your account is verified, and you’re in an eligible state, you’ll see the available redemption options directly in your account.\u003c/p\u003e\n\u003cp\u003eFor more information check \u003ca href=\&quot;https://coinsraidcom.zendesk.com/hc/en-us/articles/29414532464028-How-to-Redeem-Prizes\&quot;\u003eHow to Redeem Prizes\u003c/a\u003e and \u003ca href=\&quot;https://coinsraidcom.zendesk.com/hc/en-us/articles/29414547757724-How-to-Verify-Your-Account\&quot;\u003eHow to Verify Your Account\u003c/a\u003e.\u003c/p\u003e\n&quot;,&quot;position&quot;:10},{&quot;id&quot;:29414516052124,&quot;section_id&quot;:29389820317468,&quot;title&quot;:&quot;Daily Lootbox at CoinsRaid&quot;,&quot;body&quot;:&quot;\u003cp\u003eCoinsRaid offers the Daily Lootbox to reward active players just for coming back. Every day you log in, you can collect free rewards and progress faster in your adventure.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eWhat’s included in the Daily Lootbox:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eDaily Lootbox with surprise rewards\u003c/li\u003e\n\u003cli\u003eDaily Missions and challenges that unlock extra bonuses\u003c/li\u003e\n\u003cli\u003eSpecial streak rewards for logging in multiple days in a row\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eHow it works:\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eLog in to your CoinsRaid account each day\u003c/li\u003e\n\u003cli\u003eVisit the CoinsRaid Hub\u003c/li\u003e\n\u003cli\u003eCollect your Daily Lootbox and open it\u003c/li\u003e\n\u003cli\u003eComplete daily missions to earn even more rewards in Raider’s Guild\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eAll daily rewards are free, no purchase is required, and rewards refresh every day. Missing a day may reset your streak, so make sure to check in daily and keep your adventure going.\u003c/p\u003e\n\u003cp\u003eFor more information about Lootboxes, Missions and Raider’s Guild check these pages: \u003ca href=\&quot;https://coinsraidcom.zendesk.com/hc/en-us/articles/29414532807452-Lootboxes\&quot;\u003eLootboxes\u003c/a\u003e, \u003ca href=\&quot;https://coinsraidcom.zendesk.com/hc/en-us/articles/29414548003100-Missions-Guide\&quot;\u003eMissions Guide\u003c/a\u003e, \u003ca href=\&quot;https://coinsraidcom.zendesk.com/hc/en-us/articles/29414532769820-Raider-s-Guild-Guide\&quot;\u003eRaider’s Guild Guide\u003c/a\u003e.\u003c/p\u003e\n&quot;,&quot;position&quot;:11},{&quot;id&quot;:29414532769820,&quot;section_id&quot;:29389820317468,&quot;title&quot;:&quot;Raider\u0027s Guild Guide&quot;,&quot;body&quot;:&quot;\u003ch2\u003eWhat Is the Raider\u0027s Guild?\u003c/h2\u003e\n\u003cp\u003eThe Raider\u0027s Guild is CoinsRaid\u0027s loyalty progression system. Complete missions, earn XP, and climb through ranks. Each rank unlocks greater rewards in Gold Coins (GC) and FREE Sweeps Coins (FREE SC).\u003c/p\u003e\n\u003cp\u003eEach rank includes XP milestones you must complete before advancing.\u003c/p\u003e\n\u003cp\u003eThe Guild offers two ways to level up — free and premium — so every player can progress at their preferred pace.\u003c/p\u003e\n\u003ch2\u003eMission Types\u003c/h2\u003e\n\u003cp\u003eThe Raider\u0027s Guild includes two mission categories:\u003c/p\u003e\n\u003ch3\u003eA. Progression Missions\u003c/h3\u003e\n\u003cp\u003e\u003cem\u003e(Elite Initiation / Elite Expedition or Frontier Awakening / Frontier Discovery)\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003eThese missions are required to level up.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eHow it works:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eComplete your rank\u0027s Progression Missions to earn XP.\u003c/li\u003e\n\u003cli\u003eReach the XP milestone to unlock the next level.\u003c/li\u003e\n\u003cli\u003eEvery level provides a one-time reward of GC and FREE SC.\u003c/li\u003e\n\u003cli\u003eOnce you activate your level-up missions, you have 30 days to finish them.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIf you don\u0027t complete them in time, progress resets and a fresh 30-day cycle begins. This keeps advancement structured around monthly cycles.\u003c/p\u003e\n\u003ch3\u003eB. Weekly Loyalty Missions\u003c/h3\u003e\n\u003cp\u003e\u003cem\u003e(Weekly Elite Operations or Weekly Frontier Routines)\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003eThese missions refresh every 7 days based on your current Raider\u0027s Guild level.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eRewards include:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eGC\u003c/li\u003e\n\u003cli\u003eFREE SC\u003c/li\u003e\n\u003cli\u003eAdditional XP to speed up progression\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eEven after leveling up, weekly missions continue to grant rewards, helping you progress further in the Guild.\u003c/p\u003e\n\u003ch2\u003eChoose Your Progression Route\u003c/h2\u003e\n\u003cp\u003eYou can progress through the Raider\u0027s Guild using one of two tracks. Each has its own style, pace, and reward curve.\u003c/p\u003e\n\u003ch3\u003eFrontier Tasks: The Free Route\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e100% purchase-free.\u003c/li\u003e\n\u003cli\u003eMissions include login streaks, exploring slot games, GC turnover goals, and other simple tasks.\u003c/li\u003e\n\u003cli\u003eDesigned for steady, accessible progression using GC only.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003ePerfect for players who want freedom, no commitments, and progress at their own rhythm.\u003c/p\u003e\n\u003ch3\u003eElite Challenges: The Premium Route\u003c/h3\u003e\n\u003cp\u003eFor players seeking faster progression and higher-value rewards.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eBenefits include:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eLarger XP boosts\u003c/li\u003e\n\u003cli\u003eIncreased GC and FREE SC rewards\u003c/li\u003e\n\u003cli\u003eHigh-value progression missions\u003c/li\u003e\n\u003cli\u003eFaster level-ups and enhanced weekly rewards\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eElite Challenges may require SC gameplay or unlocking packages, but they offer significantly higher value as you climb the ranks.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eImportant:\u003c/strong\u003e Once you choose an Elite Challenge for a specific level or week, Frontier Tasks close for that period. You cannot switch paths until the next cycle.\u003c/p\u003e\n\u003ch2\u003eTracking Your Journey\u003c/h2\u003e\n\u003cp\u003eAll your Raider\u0027s Guild details are available in the CoinsRaid Hub.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eYou can view:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eYour level, XP progress, and upcoming rewards under The Raider\u0027s Guild\u003c/li\u003e\n\u003cli\u003eAll active missions under Missions\u003c/li\u003e\n\u003cli\u003eTime remaining for weekly missions and your 30-day progression cycle\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eStay on top of your journey and never miss rewards.\u003c/p\u003e\n&quot;,&quot;position&quot;:12},{&quot;id&quot;:29414548003100,&quot;section_id&quot;:29389820317468,&quot;title&quot;:&quot;Missions Guide&quot;,&quot;body&quot;:&quot;\u003cp\u003eMissions are activity-based challenges that shape your adventure, keep you engaged, and reward your consistency on CoinsRaid.\u003c/p\u003e\n\u003cp\u003eEvery mission you complete grants rewards such as Points, GC, FREE SC, Diamonds, and Gems — all helping you progress through the Raider\u0027s Guild and unlock valuable perks.\u003c/p\u003e\n\u003cp\u003eBelow is an overview of how each mission category works.\u003c/p\u003e\n\u003ch2\u003eDaily Missions\u003c/h2\u003e\n\u003cp\u003eDaily Missions are quick, simple tasks designed to keep your journey moving day by day.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eHow they work:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRefresh every 24 hours\u003c/li\u003e\n\u003cli\u003eEasy to complete\u003c/li\u003e\n\u003cli\u003eRewards are credited the same day\u003c/li\u003e\n\u003cli\u003eIdeal for steady, reliable progress\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDaily Missions help you build momentum and earn rewards consistently with minimal effort.\u003c/p\u003e\n\u003ch2\u003eWeekly Missions\u003c/h2\u003e\n\u003cp\u003eWeekly Missions introduce larger challenges and offer stronger rewards in return.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eWhat to expect:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTasks such as playing multiple game types or reaching higher turnover milestones\u003c/li\u003e\n\u003cli\u003eRewards scale with difficulty\u003c/li\u003e\n\u003cli\u003eEarn meaningful boosts of GC, FREE SC, and Points\u003c/li\u003e\n\u003cli\u003eRefresh every 7 days\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eWeekly Missions are perfect for players who want bigger progression jumps throughout the week.\u003c/p\u003e\n\u003ch2\u003eMonthly Missions\u003c/h2\u003e\n\u003cp\u003eMonthly Missions represent long-term goals that reward commitment and dedication.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eKey features:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eStretch across the entire month\u003c/li\u003e\n\u003cli\u003eEncourage consistent engagement\u003c/li\u003e\n\u003cli\u003eOffer some of the highest-value mission rewards\u003c/li\u003e\n\u003cli\u003eProvide ongoing incentives for players who play regularly\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eMonthly Missions deliver substantial bonuses for staying active over time.\u003c/p\u003e\n\u003ch2\u003eExclusive \u0026amp; Event Missions\u003c/h2\u003e\n\u003cp\u003eFrom time to time, you may receive limited-time or seasonal missions tied to special promotions.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eThese missions provide:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eBonus opportunities to earn GC, FREE SC, and Points\u003c/li\u003e\n\u003cli\u003eUnique objectives during events, holidays, or feature launches\u003c/li\u003e\n\u003cli\u003eRewards that go beyond the standard mission cycle\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eEvent Missions are your chance to accelerate progress whenever special campaigns appear.\u003c/p\u003e\n\u003ch2\u003eWhere to Track Your Missions\u003c/h2\u003e\n\u003cp\u003eAll mission categories (Daily, Weekly, Monthly, and Special) are available inside the CoinsRaid Hub under Missions.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eYou can always check:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eWhich missions are active\u003c/li\u003e\n\u003cli\u003eReward summaries\u003c/li\u003e\n\u003cli\u003eProgress toward completion\u003c/li\u003e\n\u003cli\u003eRefresh timers\u003c/li\u003e\n\u003c/ul\u003e\n&quot;,&quot;position&quot;:13},{&quot;id&quot;:29414532807452,&quot;section_id&quot;:29389820317468,&quot;title&quot;:&quot;Lootboxes&quot;,&quot;body&quot;:&quot;\u003cp\u003eLootboxes are your daily surprise chests, a fun way to collect fresh bonuses every day. Each Lootbox offers a mix of random rewards designed to boost your progress on CoinsRaid.\u003c/p\u003e\n\u003ch2\u003eFrequency\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eA new Lootbox becomes available every day.\u003c/li\u003e\n\u003cli\u003eSimply log in to unlock and claim your rewards.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDaily Lootboxes help maintain steady momentum by giving you something valuable to look forward to each day.\u003c/p\u003e\n\u003ch2\u003eRewards\u003c/h2\u003e\n\u003cp\u003eEach Lootbox contains a randomized combination of helpful items such as:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eGC\u003c/li\u003e\n\u003cli\u003eFREE SC\u003c/li\u003e\n\u003cli\u003ePoints\u003c/li\u003e\n\u003cli\u003eFree spins\u003c/li\u003e\n\u003cli\u003eExtra missions\u003c/li\u003e\n\u003cli\u003eGems\u003c/li\u003e\n\u003cli\u003eDiamonds\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eThe variety ensures every opening feels exciting and meaningful, offering new advantages for your progression.\u003c/p\u003e\n\u003ch2\u003ePurpose\u003c/h2\u003e\n\u003cp\u003eLootboxes exist to:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eProvide random daily boosts\u003c/li\u003e\n\u003cli\u003eEncourage consistent engagement\u003c/li\u003e\n\u003cli\u003eAdd variety and surprise to your adventure\u003c/li\u003e\n\u003cli\u003eSupport progression through the Raider\u0027s Guild and mission system\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eEvery Lootbox is a small step toward bigger rewards, making your daily login more rewarding and enjoyable.\u003c/p\u003e\n&quot;,&quot;position&quot;:14},{&quot;id&quot;:29414484664732,&quot;section_id&quot;:29389820317468,&quot;title&quot;:&quot;Store&quot;,&quot;body&quot;:&quot;\u003cp\u003eThe Store is your upgrade hub. It is the place where you exchange your collected Points, Gems, or Diamonds for powerful items that boost your progress and enhance your CoinsRaid adventure.\u003c/p\u003e\n\u003ch2\u003eCurrencies\u003c/h2\u003e\n\u003cp\u003eYou\u0027ll earn several types of progression currencies as you play:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ePoints\u003c/li\u003e\n\u003cli\u003eGems\u003c/li\u003e\n\u003cli\u003eDiamonds\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eThese are obtained through missions, the Daily Lootbox, special promotions, or seasonal events. Each currency may unlock different tiers of Store items.\u003c/p\u003e\n\u003ch2\u003eItems Available in the Store\u003c/h2\u003e\n\u003cp\u003eThe Store offers a rotating selection of progression-enhancing items, including:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ePurchase bonuses\u003c/li\u003e\n\u003cli\u003eFree spins\u003c/li\u003e\n\u003cli\u003eDiscounts\u003c/li\u003e\n\u003cli\u003eExclusive missions\u003c/li\u003e\n\u003cli\u003eSpecial perks that accelerate leveling and rewards\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eThese items help you push further through the Raider\u0027s Guild and maximize your overall progression.\u003c/p\u003e\n\u003ch2\u003eAvailability \u0026amp; Access\u003c/h2\u003e\n\u003cp\u003eThe Store experience adapts to your activity:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eCertain items may have purchase limits\u003c/li\u003e\n\u003cli\u003eSome perks unlock only after reaching specific levels\u003c/li\u003e\n\u003cli\u003eAvailability may vary based on your account status, progression route, or recent mission activity\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eThis ensures that rewards stay balanced, personalized, and meaningful at every stage of your journey.\u003c/p\u003e\n\u003ch2\u003eOngoing Updates\u003c/h2\u003e\n\u003cp\u003eThe Store is refreshed regularly, introducing new boosts, seasonal offers, and limited-time items to keep your adventure exciting.\u003c/p\u003e\n&quot;,&quot;position&quot;:15}]}</script><script>!function(){&quot;use strict&quot;;var e,t=&quot;https://coinsraidcom.zendesk.com&quot;,r=(e=document.currentScript)&amp;&amp;e.src?e.src.replace(/[^\/]*$/,&quot;&quot;):&quot;&quot;,n='<svg viewBox=&quot;0 0 52 52&quot; fill=&quot;none&quot; xmlns=&quot;http://www.w3.org/2000/svg&quot;><path d=&quot;M25.4577 12.1504C27.1493 12.1504 28.7256 12.4653 30.1882 13.0947C31.6536 13.7255 32.9392 14.5948 34.0456 15.7021C35.1521 16.8096 36.0213 18.095 36.652 19.5596C37.2816 21.0213 37.5974 22.5982 37.5983 24.291C37.5983 27.4901 36.6966 30.4624 34.8923 33.21C33.0863 35.9598 30.8108 38.1102 28.0651 39.6641C27.8406 39.7763 27.62 3 var SIZES = { desktop: null, tablet: [768, 1024], mobile: [375, 812] };

  var wrap = document.getElementById('wrap'), f = document.getElementById('stage'),
