name: Refresh help articles

on:
  schedule:
    - cron: "17 * * * *"  # hourly
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-articles
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild snapshot from Zendesk
        env:
          ZENDESK_CLIENT_ID: ${{ secrets.ZENDESK_CLIENT_ID }}
          ZENDESK_CLIENT_SECRET: ${{ secrets.ZENDESK_CLIENT_SECRET }}
        run: python3 scripts/refresh_articles.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- dist/help-articles.json; then
            echo "Snapshot unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/help-articles.json
          git commit -m "Refresh help article snapshot from Zendesk"
          git push
